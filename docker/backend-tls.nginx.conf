server {
    listen 8444 ssl;
    server_name local.api.wanderlust-vtt.com;

    ssl_certificate /etc/nginx/certs/local.api.wanderlust-vtt.com.pem;
    ssl_certificate_key /etc/nginx/certs/local.api.wanderlust-vtt.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8444;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
